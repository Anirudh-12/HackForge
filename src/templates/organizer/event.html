{% extends "base_app.html" %}
{% block title %}Event{% endblock %}
{% block content %}
<h1>Event Settings</h1>
<form method="post" enctype="multipart/form-data">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
    <div>
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" class="input" value="{{ event.name }}" required>
      </div>
      
      <div class="form-group">
        <label>Event Banner Image</label>
        <input type="file" name="banner_image" class="input" accept="image/*">
        {% if event.banner_image_path %}
          <div style="margin-top: 8px;">
            <img src="{{ event.banner_image_path }}" style="height: 100px; border-radius: var(--radius); border: 1px solid var(--border); object-fit: cover;">
          </div>
        {% endif %}
      </div>
      
      <div class="form-group">
        <label>Submissions open (UTC)</label>
        <input type="datetime-local" class="input" name="submissions_open" value="{{ event.submissions_open.strftime('%Y-%m-%dT%H:%M') if event.submissions_open else '' }}">
      </div>
      <div class="form-group">
        <label>Submissions close (UTC)</label>
        <input type="datetime-local" class="input" name="submissions_close" value="{{ event.submissions_close.strftime('%Y-%m-%dT%H:%M') if event.submissions_close else '' }}">
      </div>
      <div class="form-group">
        <label>Judging open (UTC)</label>
        <input type="datetime-local" class="input" name="judging_open" value="{{ event.judging_open.strftime('%Y-%m-%dT%H:%M') if event.judging_open else '' }}">
      </div>
      <div class="form-group">
        <label>Judging close (UTC)</label>
        <input type="datetime-local" class="input" name="judging_close" value="{{ event.judging_close.strftime('%Y-%m-%dT%H:%M') if event.judging_close else '' }}">
      </div>
    </div>
    
    <div>
      <div class="form-group">
        <label>Event Description (Markdown)</label>
        <textarea name="description_markdown" class="input" rows="8" placeholder="Welcome to the biggest hackathon of the year...">{{ event.description_markdown or '' }}</textarea>
      </div>
      <div class="form-group">
        <label>Rules & FAQs (Markdown)</label>
        <textarea name="rules_markdown" class="input" rows="12" placeholder="## Rules...&#10;## FAQs...">{{ event.rules_markdown or '' }}</textarea>
      </div>
    </div>
  </div>
  
  <div class="row-actions" style="margin-top: 24px;">
    <button class="btn btn-primary" type="submit">Save Changes</button>
  </div>
</form>
{% endblock %}
