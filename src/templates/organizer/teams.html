{% extends "base_app.html" %}
{% block title %}Teams{% endblock %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
  <h1 style="margin: 0;">Teams</h1>
</div>

<div class="card" style="padding: 24px;">
  <div style="margin-bottom: 20px;">
    <input type="text" id="teamSearch" class="input" placeholder="Search teams by name..." style="width: 100%; max-width: 400px;" oninput="filterTeams()">
  </div>
  {% if teams %}
  <table class="data-table" id="teamsTable">
    <thead>
      <tr>
        <th>Team Name</th>
        <th>Invite Token</th>
      </tr>
    </thead>
    <tbody>
      {% for team in teams %}
      <tr class="team-row" data-name="{{ team.name|lower }}">
        <td>{{ team.name }}</td>
        <td>{{ team.invite_token or '—' }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p style="color: var(--text-secondary); text-align: center; margin: 0;">No teams have registered yet.</p>
  {% endif %}
</div>

<script>
function filterTeams() {
  const q = document.getElementById('teamSearch').value.toLowerCase();
  document.querySelectorAll('.team-row').forEach(row => {
    const name = row.dataset.name;
    row.style.display = name.includes(q) ? '' : 'none';
  });
}
</script>
{% endblock %}
