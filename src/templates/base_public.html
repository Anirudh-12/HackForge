<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hackforge{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('hackforge_theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <header class="topnav">
    <a class="brand" href="/">Hackforge</a>
    <nav class="topnav-links" style="display: flex; align-items: center; gap: 14px;">
      <a href="/projects">Explore Projects</a>
      <a href="/api/docs" style="display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(56,189,248,0.15); color: #38bdf8; font-weight: 600;">API</span>
        Docs
      </a>
      <a href="/docs" target="_blank" style="display: flex; align-items: center; gap: 4px; color: var(--text-muted); font-size: 13px;" title="Interactive FastAPI Swagger UI">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        Swagger (/docs)
      </a>

      {% if user %}
        <a href="/login" class="btn btn-ghost" style="text-decoration: none;">Workspace</a>
        <!-- Dark / Light Theme Toggle -->
        <button id="publicThemeToggleBtn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme" style="margin-left: 4px;">
          <svg id="publicThemeIconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="publicThemeIconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <div style="position: relative;">
          <!-- Profile Icon Dropdown -->
          <div style="cursor: pointer; display: flex; align-items: center;" onclick="const d = document.getElementById('profileDropdownPublic'); d.style.display = d.style.display === 'none' ? 'block' : 'none'; event.stopPropagation();">
            <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent, #3b82f6); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; box-shadow: 0 0 0 2px var(--surface, #1e1e1e), 0 0 0 4px var(--accent, #3b82f6);">
              {{ user.name[0].upper() if user.name else 'U' }}
            </div>
          </div>
          
          <div id="profileDropdownPublic" style="display: none; position: absolute; top: 100%; right: 0; background: var(--surface, #1e1e1e); border: 1px solid var(--border, #333); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); margin-top: 12px; min-width: 240px; z-index: 50; padding: 8px 0; text-align: left;">
            <div style="padding: 12px 16px; border-bottom: 1px solid var(--border, #333); margin-bottom: 4px;">
              <div style="font-weight: 500; color: var(--text-primary, #fff);">{{ user.name }}</div>
              <div style="font-size: 12px; color: var(--text-muted, #999); margin-top: 2px;">{{ user.email }}</div>
            </div>
            <a href="/profile" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: var(--text-primary, #fff); text-decoration: none; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='var(--border, #333)'" onmouseout="this.style.backgroundColor='transparent'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              View Profile
            </a>
            <a href="/profile" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: var(--text-primary, #fff); text-decoration: none; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='var(--border, #333)'" onmouseout="this.style.backgroundColor='transparent'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              Settings
            </a>
            <div style="border-top: 1px solid var(--border, #333); margin: 8px 0;"></div>
            <form method="post" action="/logout" style="margin: 0;">
              <button type="submit" style="display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 16px; color: #ef4444; background: none; border: none; cursor: pointer; font-family: inherit; font-size: inherit; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='rgba(239, 68, 68, 0.1)'" onmouseout="this.style.backgroundColor='transparent'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
              </button>
            </form>
          </div>
          <script>
            document.addEventListener('click', function(e) {
              const d = document.getElementById('profileDropdownPublic');
              if (d && e.target.closest('#profileDropdownPublic') === null && !e.target.closest('[onclick*="profileDropdownPublic"]')) {
                d.style.display = 'none';
              }
            });
          </script>
        </div>
      {% else %}
        <!-- Dark / Light Theme Toggle -->
        <button id="publicThemeToggleBtn" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme" style="margin-left: 4px;">
          <svg id="publicThemeIconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="publicThemeIconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="/login" class="btn btn-ghost" style="text-decoration: none;">Sign in</a>
        <a href="/register" class="btn btn-primary" style="text-decoration: none;">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script>
    (function initPublicThemeToggle() {
      const btn = document.getElementById('publicThemeToggleBtn');
      if (!btn) return;
      const sun = document.getElementById('publicThemeIconSun');
      const moon = document.getElementById('publicThemeIconMoon');

      function updateIcon() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark' || 
                      (!document.documentElement.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          sun.style.display = 'block';
          moon.style.display = 'none';
        } else {
          sun.style.display = 'none';
          moon.style.display = 'block';
        }
      }
      updateIcon();

      btn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let nextTheme = 'light';
        if (current === 'dark') {
          nextTheme = 'light';
        } else if (current === 'light') {
          nextTheme = 'dark';
        } else {
          nextTheme = isSystemDark ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('hackforge_theme', nextTheme);
        updateIcon();
      });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (!document.documentElement.hasAttribute('data-theme')) {
          updateIcon();
        }
      });
    })();
  </script>
</body>
</html>
