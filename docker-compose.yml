services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      SESSION_SECRET: hackforge-dev-secret
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/hackforge.db
    volumes:
      - ./src:/app/src
      - ./fixtures.json:/app/fixtures.json:ro
      - portal-data:/app/data

volumes:
  portal-data:
